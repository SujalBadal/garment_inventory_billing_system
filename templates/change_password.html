{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Garment Billing System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/change_password.css' %}">
</head>
<body>
    <div class="change-wrapper">
        <div class="change-card">
            <div class="card-header">
                <h2>Change Password</h2>
                <p>Update your shop account's security password</p>
            </div>
            
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="{% url 'change_password' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required autocomplete="current-password">
                </div>
                
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new secure password" required autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary">Update Password</button>
            </form>
            
            <div class="card-footer">
                <p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
            </div>
        </div>
    </div>
</body>
</html>
