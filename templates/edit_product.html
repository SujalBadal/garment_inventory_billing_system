{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Garment Billing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/edit_product.css' %}">
</head>
<body>
    <div class="edit-wrapper">
        <div class="edit-card">
            <div class="card-header">
                <h2>Edit Product</h2>
                <p>Update product parameters for ID: {{ product.product_id }}</p>
            </div>
            
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="{% url 'edit_product' product.product_id %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            {% for category in categories %}
                                <option value="{{ category.id }}" {% if category.id == product.category.id %}selected{% endif %}>{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="subcategory">Subcategory</label>
                        <select id="subcategory" name="subcategory" required>
                            {% for subcategory in subcategories %}
                                <option value="{{ subcategory.id }}" data-category-id="{{ subcategory.category.id }}" {% if subcategory.id == product.subcategory.id %}selected{% endif %}>{{ subcategory.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="purchase_price">Purchase Price (Per Unit)</label>
                        <input type="number" step="0.01" id="purchase_price" name="purchase_price" value="{{ product.purchase_price }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="selling_price">Selling Price (Per Unit)</label>
                        <input type="number" step="0.01" id="selling_price" name="selling_price" value="{{ product.selling_price }}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="qty">Quantity</label>
                        <input type="number" id="qty" name="qty" value="{{ product.qty }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="rack_location">Rack Location</label>
                        <input type="text" id="rack_location" name="rack_location" value="{{ product.rack_location }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="image">Change Product Image</label>
                    {% if product.image %}
                        <div class="image-current">
                            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="thumb-current">
                            <span>Current Image</span>
                        </div>
                    {% endif %}
                    <input type="file" id="image" name="image" accept="image/*">
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <a href="{% url 'products_list' %}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const categorySelect = document.getElementById('category');
            const subcategorySelect = document.getElementById('subcategory');
            
            if (categorySelect && subcategorySelect) {
                
                const allSubcategories = Array.from(subcategorySelect.options);

                
                filterSubcategories(categorySelect.value, "{{ product.subcategory.id }}");

                categorySelect.addEventListener('change', function() {
                    filterSubcategories(this.value, null);
                });

                function filterSubcategories(selectedCategoryId, selectedSubcategoryId) {
                    subcategorySelect.innerHTML = '';
                    const filtered = allSubcategories.filter(option => option.getAttribute('data-category-id') === selectedCategoryId);
                    
                    if (filtered.length > 0) {
                        filtered.forEach(option => {
                            const clone = option.cloneNode(true);
                            if (selectedSubcategoryId && clone.value == selectedSubcategoryId) {
                                clone.selected = true;
                            }
                            subcategorySelect.appendChild(clone);
                        });
                    } else {
                        const noOption = document.createElement('option');
                        noOption.value = "";
                        noOption.disabled = true;
                        noOption.selected = true;
                        noOption.textContent = "No subcategories available";
                        subcategorySelect.appendChild(noOption);
                    }
                }
            }
        });
    </script>
</body>
</html>
