{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subcategory - Garment Billing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/edit_subcategory.css' %}">
</head>
<body>
    <div class="edit-wrapper">
        <div class="edit-card">
            <div class="card-header">
                <h2>Edit Subcategory</h2>
                <p>Modify subcategory details</p>
            </div>
            
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="{% url 'edit_subcategory' subcategory.id %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="category">Parent Category</label>
                    <select id="category" name="category" required>
                        {% for category in categories %}
                            <option value="{{ category.id }}" {% if category.id == subcategory.category.id %}selected{% endif %}>{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="name">Subcategory Name</label>
                    <input type="text" id="name" name="name" value="{{ subcategory.name }}" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <a href="{% url 'subcategories_list' %}" class="btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
