{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Garment Billing System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
</head>
<body>
    <div class="forgot-wrapper">
        <div class="forgot-card">
            <div class="card-header">
                <h2>Reset Password</h2>
                <p>Verify shop owner details to set a new password</p>
            </div>
            
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="{% url 'forgot_password' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Registered Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your shop email" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="owner_name">Owner Name</label>
                    <input type="text" id="owner_name" name="owner_name" placeholder="Enter owner name exactly as registered" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter registered phone number" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary">Reset Password</button>
            </form>
            
            <div class="card-footer">
                <p>Remembered your password? <a href="{% url 'login' %}">Back to Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
