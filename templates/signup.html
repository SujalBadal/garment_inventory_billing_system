{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Registration - Garment Billing System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-card">
            <div class="card-header">
                <h2>Register Shop</h2>
                <p>Create an account for your garment store management</p>
            </div>
            
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="{% url 'signup' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label for="owner_name">Owner Name</label>
                        <input type="text" id="owner_name" name="owner_name" placeholder="Enter owner's full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="shop_name">Shop Name</label>
                        <input type="text" id="shop_name" name="shop_name" placeholder="Enter store/shop name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter shop email" required autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter contact number" required autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a secure password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="address">Shop Address</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter complete physical address of your shop" required></textarea>
                </div>

                <div class="form-group">
                    <label for="logo">Shop Logo</label>
                    <input type="file" id="logo" name="logo" accept="image/*">
                </div>

                <button type="submit" class="btn-primary">Register Store</button>
            </form>
            
            <div class="card-footer">
                <p>Already registered your shop? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
